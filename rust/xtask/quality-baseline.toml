"uqm::comm::races::orz::api::<crate::comm::races::script::live::LiveScript<'_,'_,Handler> as OrzApi>::remove_escorts" = '{"file":"src/comm/races/orz/api.rs","first":11,"text":"fn remove_escorts(&mut self, race: u16) {\n        use crate::engine::world::fleet;\n        let remaining = fleet::remove_escort_ships(self.cx.borrow_mut().world, race, u16::MAX);\n        if remaining > 0 {\n            // SAFETY: the campaign borrow ends before the game-thread display refresh.\n            {\n                let cx = &mut *self.cx.borrow_mut();\n                crate::ui::sis::delta_sis_gauges(cx.kernel, cx.world, 32767, 32767, 32767)\n            };\n        }\n    }","lines":{"1":false,"3":false,"4":false,"5":false,"6":false,"7":false,"8":false,"9":false,"10":false,"11":false}}'
