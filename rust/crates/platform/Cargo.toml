[package]
name = "uqm-platform"
version.workspace = true
edition = "2021"
publish = false
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[build-dependencies]
pkg-config = "0.3"

[dependencies]
uqm-engine = { path = "../engine", version = "=0.9.0", default-features = false }
libc = "0.2"
sdl2 = "0.37"
sdl2-sys = "0.37"
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis"] }
cpal = "0.15"
xbrz-rs = "0.1.0"

[features]
default = ["audio_heart"]
audio_heart = ["uqm-engine/audio_heart"]
debug-process = ["uqm-engine/debug-process"]
bundled-sdl = ["sdl2/bundled", "sdl2/static-link"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_Console", "Win32_Foundation"] }
