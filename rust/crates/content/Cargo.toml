[package]
name = "uqm-content"
version.workspace = true
edition = "2021"
publish = false
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
uqm-engine = { path = "../engine", version = "=0.9.0", default-features = false }
thiserror = "1.0"

[features]
default = ["audio_heart"]
audio_heart = ["uqm-engine/audio_heart"]
test-support = ["uqm-engine/test-support"]

[dev-dependencies]
uqm-engine = { path = "../engine", version = "=0.9.0", default-features = false, features = ["test-support"] }
serial_test = "3.0"
