[package]
name = "uqm-xtask"
version = "0.8.0"
edition = "2021"
publish = false
default-run = "uqm-xtask"

[dependencies]
clang-sys = { version = "1.9", features = ["runtime", "clang_6_0"] }
quote = "1"
syn = { version = "2", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uqm-rust = { package = "uqm", path = "..", default-features = false, features = ["audio_heart", "debug-process"] }
uqm-ownership = { path = "../ownership" }
zip = "9"
