[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "2"

[profile.release]
codegen-units = 1
lto = "off"

# The native-acceptance observer runs inside the debug xtask build and, at
# every checkpoint, decodes the OS screenshot, Lanczos-resamples the client
# crop and re-encodes it. Unoptimized codecs spend about 3.4 s on that per
# checkpoint; optimized, about 0.1 s. Only these third-party image crates are
# optimized; workspace crates keep the ordinary dev profile.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3

# Command supervision hashes each executable it launches: twice for a staged
# copy. The xtask unit-test binary is over 170 MB, and unoptimized SHA-256
# spent longer on that than the 30 s helper registration window on aarch64
# Linux, so the supervised helper was never launched in time.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3

[package]
name = "uqm"
version = "0.8.0"
edition = "2021"

[lib]
name = "uqm_rust"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "uqm-gameplay-proof"
path = "src/bin/uqm_gameplay_proof.rs"

[build-dependencies]
pkg-config = "0.3"
bindgen = "0.70"

[dependencies]
libc = "0.2"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
sdl2 = "0.37"
sdl2-sys = "0.37"
gl = "0.14"
crossbeam = "0.8"
parking_lot = "0.12"
# PNG only. The default feature set pulls in AVIF and OpenEXR decoders that
# nothing here uses, and with them an unmaintained transitive dependency.
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
portable-atomic = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
lewton = "0.10"
ogg = "0.9"
xbrz-rs = "0.1.0"
memoffset = "0.9.1"
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis"] }
cpal = "0.15"
regex = "1" # @plan PLAN-20260314-FILE-IO.P07 @requirement REQ-FIO-DIRLIST-REGEX
zip = "9" # @plan PLAN-20260314-FILE-IO.P09 @requirement REQ-FIO-ARCHIVE-MOUNT
crc32fast = "1.4" # @plan PLAN-20260314-FILE-IO.P09 @requirement REQ-FIO-ARCHIVE-MOUNT
bitflags = "2.4" # @plan PLAN-20260320-BATTLE.P04 @requirement REQ-BAT-006 Element state flags
serde = { version = "1", features = ["derive"] } # @plan PLAN-20260723-RUNTIME-AUTOMATION.P01 @requirement REQ-DEP-002
serde_json = "1" # @plan PLAN-20260723-RUNTIME-AUTOMATION.P01 @requirement REQ-DEP-002
sha2 = "0.10" # @plan PLAN-20260723-RUNTIME-AUTOMATION.P03 @requirement REQ-IO-003

mod_player = "0.1"
# UQM's scaler contract requires RGBA U8x4 pixel format exclusively.
# The only_u8x4 feature disables all non-U8x4 pixel paths in fast_image_resize,
# reducing code size and ensuring the scaler only compiles paths that match
# UQM's RGBA8888 framebuffer format. This is a reproducibility and correctness
# requirement: UQM never uses U8, U16, or F32 pixel types with the scaler.
fast_image_resize = { version = "5.0", features = ["only_u8x4"] }

[features]
default = []
audio_heart = []
debug-process = []
linked_c_archive = []

[[bin]]
name = "uqm"
path = "src/main.rs"
required-features = ["linked_c_archive"]

[[bin]]
name = "uqm-native-acceptance"
path = "src/bin/uqm-native-acceptance.rs"
required-features = ["debug-process"]

[[test]]
name = "planets_parity"
path = "tests/planets_parity.rs"
required-features = ["linked_c_archive"]

[[test]]
name = "linked_provider_fixture"
path = "tests/linked_provider_fixture.rs"
required-features = ["linked_c_archive"]

[dev-dependencies]
tempfile = "3"
insta = "1.34"
proptest = "1.4"
rstest = "0.18"
serial_test = "3.0"

[[test]]
name = "netplay_packets"
path = "tests/netplay_packets.rs"
required-features = ["linked_c_archive"]

[[test]]
name = "graphics_loading"
path = "tests/graphics_loading.rs"
required-features = ["linked_c_archive"]

[[test]]
name = "canvas_native"
path = "tests/canvas_native.rs"
required-features = ["linked_c_archive"]

[[test]]
name = "queue_native"
path = "tests/queue_native.rs"
required-features = ["linked_c_archive"]

[[test]]
name = "video_native"
path = "tests/video_native.rs"
required-features = ["linked_c_archive"]
