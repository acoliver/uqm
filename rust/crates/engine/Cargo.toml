[package]
name = "uqm-engine"
version.workspace = true
edition = "2021"
publish = false
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[build-dependencies]
pkg-config = "0.3"

[dependencies]
uqm-save = { path = "../save", version = "=0.9.0" }
libc = "0.2"
anyhow = "1.0"
thiserror = "1.0"
sdl2 = "0.37"
sdl2-sys = "0.37"
gl = "0.14"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
portable-atomic = "1.9"
log = "0.4"
lewton = "0.10"
ogg = "0.9"
xbrz-rs = "0.1.0"
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis"] }
cpal = "0.15"
regex = "1" # @plan PLAN-20260314-FILE-IO.P07 @requirement REQ-FIO-DIRLIST-REGEX
zip = { version = "9", default-features = false, features = ["deflate"] } # UQM packages use stored/deflate entries.
crc32fast = "1.4" # @plan PLAN-20260314-FILE-IO.P09 @requirement REQ-FIO-ARCHIVE-MOUNT
fast_image_resize = { version = "5.0", features = ["only_u8x4"] }

[features]
default = ["audio_heart"]
audio_heart = []
debug-process = []
bundled-sdl = ["sdl2/bundled", "sdl2/static-link"]

[dev-dependencies]
tempfile = "3"
proptest = "1.4"
serial_test = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_Console", "Win32_Foundation"] }
