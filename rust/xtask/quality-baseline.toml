"uqm::comm::races::pkunk::api::<crate::comm::races::script::live::LiveScript<'_,'_,Handler> as PkunkApi>::gift_ships" = '{"file":"src/comm/races/pkunk/api.rs","first":20,"text":"fn gift_ships(&mut self) -> u16 {\n        use crate::engine::world::fleet;\n        let added = fleet::add_escort_ships(\n            self.cx.borrow_mut().world,\n            crate::comm::dispatch::ship::PKUNK_SHIP as u16,\n            4,\n            fleet::captain_name,\n        );\n        match added {\n            Some(count) => {\n                // SAFETY: the campaign borrow ends before the game-thread display refresh.\n                {\n                    let cx = &mut *self.cx.borrow_mut();\n                    crate::ui::sis::delta_sis_gauges(cx.kernel, cx.world, 32767, 32767, 32767)\n                };\n                count\n            }\n            None => 0,\n        }\n    }","lines":{"1":false,"3":false,"4":false,"5":false,"9":false,"10":false,"13":false,"14":false,"16":false,"18":false,"20":false}}'
