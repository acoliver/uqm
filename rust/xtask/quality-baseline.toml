"uqm::comm::races::urquan::api::<super::super::script::live::LiveScript<'_,'_,Handler> as UrquanApi>::group_battle" = '{"file":"src/comm/races/urquan/api.rs","first":16,"text":"fn group_battle(&self, state_key: StoryKey) -> bool {\n        self.cx.borrow_mut().with_legacy(|| {\n            let offset = {\n                World::current().read(|world| {\n                    crate::state::ffi::rust_get_game_state_32(world, state_key.start() as i32)\n                })\n            };\n            {\n                WorldData::current().read(|owner| owner.game.battle_group_ref) != 0\n                    && WorldData::current().read(|owner| owner.game.battle_group_ref) == offset\n            }\n        })\n    }","lines":{"1":false,"2":false,"3":false,"4":false,"5":false,"6":false,"9":false,"10":false,"12":false,"13":false}}'
