name: Rust Quality Checks

on:
  push:
    branches: [ main, develop, phase0-foundation ]
    paths:
      - rust/**
      - .github/workflows/rust-quality.yaml
      - dev-docs/rust/ownership-and-strict-linking.md
      - dev-docs/rust/howtorun.md
      - dev-docs/rust/howtoconfigure.md
      - dev-docs/README.md
  pull_request:
    branches: [ main, develop ]
    paths:
      - rust/**
      - .github/workflows/rust-quality.yaml
      - dev-docs/rust/ownership-and-strict-linking.md
      - dev-docs/rust/howtorun.md
      - dev-docs/rust/howtoconfigure.md
      - dev-docs/README.md

jobs:
  ownership-strict-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Validate ownership mutations
        run: cargo test --manifest-path rust/ownership/Cargo.toml --all-targets
      - name: Lint ownership validator
        run: cargo clippy --manifest-path rust/ownership/Cargo.toml --all-targets -- -D warnings
      - name: Verify focused S1 strict production-link contract
        run: rust/ownership/verify-fixture.sh
      - name: Upload focused S1 strict-link artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ownership-s1-strict-link-fixture
          path: rust/target/ownership-strict-link-fixture/
          if-no-files-found: error

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libsdl2-dev
          pip3 install --break-system-packages lizard
          cargo install cargo-audit

      - name: Check formatting
        run: |
          cd rust
          cargo fmt -- --check

      - name: Run clippy
        run: |
          cd rust
          cargo clippy -- -D warnings

      - name: Check complexity
        run: |
          lizard -C 50 -w rust/ -x "*.c" -x "*.h"

      - name: Security audit
        run: |
          cd rust
          cargo audit

      - name: Validate workflows
        uses: rhysd/actionlint@v1.7.7

  test-ubuntu:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          cd rust
          cargo llvm-cov --lib --lcov --remap-path-prefix --output-path coverage-ubuntu.lcov \
            --ignore-filename-regex '(/target/|/bindings\.rs$)'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: rust/coverage-ubuntu.lcov

  test-macos:
    runs-on: macos-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        env:
          LIBRARY_PATH: /opt/homebrew/lib:/usr/local/lib
        run: |
          cd rust
          cargo llvm-cov --lib --lcov --remap-path-prefix --output-path coverage-macos.lcov \
            --ignore-filename-regex '(/target/|/bindings\.rs$)'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos
          path: rust/coverage-macos.lcov

  coverage-report:
    runs-on: ubuntu-latest
    needs: [test-ubuntu, test-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Install coverage tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage

      - name: Combine coverage reports
        shell: bash
        run: |
          lcov -a coverage/coverage-ubuntu/coverage-ubuntu.lcov \
               -a coverage/coverage-macos/coverage-macos.lcov \
               -o combined.lcov
          # Remove generated bindings from coverage (target/.../bindings.rs)
          lcov --ignore-errors unused --remove combined.lcov '*/target/*/bindings.rs' -o combined.lcov

      - name: Generate HTML report
        run: |
          cd rust
          genhtml ../combined.lcov --output-directory ../coverage-html --ignore-errors source

      - name: Enforce coverage threshold
        shell: bash
        run: |
          coverage=$(lcov --summary combined.lcov | awk '/lines\./ {gsub("%","",$2); print $2}')
          echo "Total line coverage: ${coverage}%"
          awk -v cov="$coverage" 'BEGIN { if (cov < 80) { exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
