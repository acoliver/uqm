[graph]
all-features = true

[advisories]
# rust-cache prunes non-build files under target, including advisory Git metadata.
db-path = "../tmp/advisory-db"
yanked = "deny"
ignore = []

[licenses]
# All are compatible with the project's GPL-2.0-or-later distribution.
allow = [
    "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause",
    "GPL-2.0-or-later", "GPL-3.0-only", "ISC", "MIT", "Unicode-3.0", "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
