nt_array[10].block_mask = 1 << 9;\n    d.alien_talk_desc = animation(1, 4, 0, (42, 0), (56, 0));\n    #[cfg(not(test))]\n    {\n        d.init_encounter_func = Some(live::intro);\n        d.post_encounter_func = Some(live::post);\n        d.uninit_encounter_func = Some(live::uninit);\n    }\n    d\n}","lines":{"1":true,"2":true,"3":true,"4":true,"5":true,"6":true,"7":true,"8":true,"9":true,"10":true,"11":true,"12":true,"13":true,"14":true,"15":true,"16":true,"17":true,"18":true,"19":true,"20":true,"21":true,"22":true,"23":true,"24":true,"25":true,"26":true,"27":true,"28":true,"29":true,"30":true,"31":true,"32":true,"33":true,"34":true,"35":true,"36":true,"37":true,"38":true,"39":true,"40":true,"41":true,"42":true,"43":true,"45":true,"46":true,"47":true,"48":true,"49":true,"50":true,"51":true}}'
