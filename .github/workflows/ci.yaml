name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Toolchain is pinned so new stable lints do not fail unrelated pull requests.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      # Exercise the production Rust providers and automation support.
      FEATURES: audio_heart,debug-process
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libsdl2-dev pkg-config
        working-directory: .
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --no-default-features --features "$FEATURES" -- -D warnings
      - run: cargo test --workspace --locked --no-default-features --features "$FEATURES"

  c-ratchet:
    # Zero-C progress meter: the number of tracked C/C++/Objective-C files may only go down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count tracked C sources
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          count() { git ls-tree -r --name-only "$1" | grep -Ec '\.(c|h|cc|cpp|hpp|m|mm)$' || true; }
          head=$(count HEAD)
          echo "tracked C/C++/Objective-C files: ${head}"
          if [ -n "${BASE_REF}" ]; then
            git fetch --quiet --depth=1 origin "${BASE_REF}"
            base=$(count FETCH_HEAD)
            echo "base (${BASE_REF}): ${base}"
            test "${head}" -le "${base}" || { echo "::error::C file count grew from ${base} to ${head}"; exit 1; }
          fi

  game-build:
    # Build the game with the same plain Cargo command used locally.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install pkg-config sdl2
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml --bin uqm

  failure-scenarios:
    name: Failure scenario (${{ matrix.scenario }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - lander-destroyed-v1
          - out-of-fuel-v1
          - lost-battle-v1
          - super-melee-v1
    steps:
      - uses: actions/checkout@v4
      - run: brew install pkg-config sdl2
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # native run builds the instrumented game and checks the real OS window.
      - name: Run scenario
        run: |
          mkdir -p tmp/failure-scenarios
          cargo run --release --locked --manifest-path rust/xtask/Cargo.toml -- \
            native run --scenario ${{ matrix.scenario }} \
            --artifacts "$GITHUB_WORKSPACE/tmp/failure-scenarios/${{ matrix.scenario }}" \
            --content "$GITHUB_WORKSPACE/sc2/content/packages"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ matrix.scenario }}
          path: tmp/failure-scenarios/${{ matrix.scenario }}
          retention-days: 3
