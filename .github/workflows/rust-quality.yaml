name: Rust Quality Checks

on:
  push:
    branches: [ main, develop, phase0-foundation ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership-strict-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Validate ownership mutations
        run: cargo test --manifest-path rust/ownership/Cargo.toml --all-targets
      - name: Lint ownership validator
        run: cargo clippy --manifest-path rust/ownership/Cargo.toml --all-targets -- -D warnings
      - name: Verify focused S1 strict production-link contract
        run: rust/ownership/verify-fixture.sh
      - name: Upload focused S1 strict-link artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ownership-s1-strict-link-fixture
          path: rust/target/ownership-strict-link-fixture/
          if-no-files-found: error


  s3-linked-test-fixtures:
    name: S3 pure and strict linked-test fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: rustfmt, clippy
          rustflags: ''
      - name: Install production prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libsdl2-dev libpng-dev liblzma-dev libbz2-dev pkg-config
      - name: Run S3 canonical fixture command
        shell: bash
        run: |
          set -o pipefail
          mkdir -p rust/target
          cargo run --locked --manifest-path rust/xtask/Cargo.toml -- test 2>&1 | tee rust/target/s3-test.log
      - name: Upload S3 fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s3-linked-test-fixtures
          path: |
            rust/target/s3-test.log
            rust/target/debug/build/uqm-*/out/native-build-evidence.json
            rust/target/debug/build/uqm-*/out/provider-report.json
            rust/target/debug/build/uqm-*/out/uqm-c-objects.manifest
          if-no-files-found: error


  reproducible-build-contract:
    name: Clean checkout root command (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
            tuple: linux-x86_64
          - os: ubuntu-24.04-arm
            expected_arch: aarch64
            tuple: linux-aarch64
          - os: macos-15-intel
            expected_arch: x86_64
            tuple: macos-x86_64
          - os: macos-15
            expected_arch: arm64
            tuple: macos-aarch64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: rustfmt, clippy
          rustflags: ''
          cache: false
      - name: Assert official runner architecture
        run: |
          actual=$(uname -m)
          test "$actual" = "${{ matrix.expected_arch }}" || { echo "expected ${{ matrix.expected_arch }}, got $actual"; exit 1; }
      - name: Install Ubuntu production prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libsdl2-dev libpng-dev liblzma-dev libbz2-dev pkg-config
      - name: Install macOS production prerequisites
        if: runner.os == 'macOS'
        run: brew install sdl2 libpng xz bzip2 pkg-config
      - name: Validate root command and machine-readable matrix
        run: |
          cargo run --locked --manifest-path rust/xtask/Cargo.toml -- doctor
          cargo run --locked --manifest-path rust/xtask/Cargo.toml -- matrix > rust/target-supported-matrix.json
      - name: Test root-command negative fixtures
        run: cargo test --locked --manifest-path rust/xtask/Cargo.toml --all-targets
      - name: Prove strict production determinism from clean builds
        run: |
          rm rust/target-supported-matrix.json
          cargo run --locked --manifest-path rust/xtask/Cargo.toml -- prove
      - name: Verify all S1 strict-link invariants
        run: rust/ownership/verify-production.sh
      - name: Reject exact target dependency-inventory drift
        run: |
          cargo run --locked --manifest-path rust/xtask/Cargo.toml -- capture-dependencies
          jq -n \
            --slurpfile authority rust/build/native-dependencies.json \
            --slurpfile capture "rust/target/native-dependencies-${{ matrix.tuple }}.candidate.json" \
            --arg tuple "${{ matrix.tuple }}" '
            ([$authority[0].dependencies[] | select(.targets | index($tuple)) | .path] | sort)
            == ($capture[0].dependencies | sort)
          ' | grep -qx true
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducible-build-${{ matrix.tuple }}
          path: |
            rust/target/production-artifacts.json
            rust/target-supported-matrix.json
            rust/target/ownership-production-report.json
          if-no-files-found: error

  issue23-native-acceptance:
    name: Issue 23 native acceptance (${{ matrix.tuple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            expected_arch: x86_64
            tuple: macos-x86_64-compatibility
          - os: macos-14
            expected_arch: arm64
            tuple: macos-14-aarch64
          - os: ubuntu-22.04
            expected_arch: x86_64
            tuple: ubuntu-22.04-x86_64
          - os: ubuntu-24.04-arm
            expected_arch: aarch64
            tuple: ubuntu-24.04-aarch64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          rustflags: ''
          cache: false
      - name: Assert native runner architecture
        run: |
          actual=$(uname -m)
          test "$actual" = "${{ matrix.expected_arch }}" || { echo "expected ${{ matrix.expected_arch }}, got $actual"; exit 1; }
      - name: Install Linux gameplay prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libsdl2-dev libpng-dev liblzma-dev libbz2-dev pkg-config
      - name: Install macOS gameplay prerequisites
        if: runner.os == 'macOS'
        run: brew install sdl2 libpng xz bzip2 pkg-config
      - name: Run canonical strict link, probes, harnesses, gameplay, shutdown, and mutations
        run: rust/scripts/run_issue23_acceptance.sh
      - name: Upload all issue-23 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue23-native-${{ matrix.tuple }}
          path: |
            rust/target/issue23-acceptance/
            rust/target/production-artifacts.json
            rust/target/ownership-production-report.json
            rust/target/debug/build/uqm-*/out/native-build-evidence.json
            rust/target/debug/build/uqm-*/out/provider-report.json
            rust/target/debug/build/uqm-*/out/uqm-c-objects.manifest
          if-no-files-found: error

  issue23-macos13-exclusion:
    name: Issue 23 macOS 13 x86_64 runner exclusion
    runs-on: macos-15-intel
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record unavailable official runner tuple
        run: |
          mkdir -p rust/target/issue23-exclusions
          cat > rust/target/issue23-exclusions/macos-13-x86_64.json <<'JSON'
          {
            "schema": "uqm-excluded-native-execution-v1",
            "tuple": "macos-13-x86_64",
            "executed": false,
            "reason": "GitHub Actions no longer provides the macos-13 hosted runner label; actionlint's official runner-label database rejects it. The maintained native Intel compatibility execution uses macos-15-intel."
          }
          JSON
      - name: Upload machine-readable exclusion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue23-excluded-macos-13-x86_64
          path: rust/target/issue23-exclusions/macos-13-x86_64.json
          if-no-files-found: error

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libsdl2-dev
          pip3 install --break-system-packages lizard
          cargo install cargo-audit

      - name: Check formatting
        run: |
          cd rust
          cargo fmt -- --check

      - name: Run clippy
        run: |
          cd rust
          cargo clippy -- -D warnings

      - name: Check complexity
        run: |
          lizard -C 50 -w rust/ -x "*.c" -x "*.h"

      - name: Security audit
        run: |
          cd rust
          cargo audit

      - name: Validate workflows
        uses: rhysd/actionlint@v1.7.7

  test-ubuntu:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          cd rust
          cargo llvm-cov --lib --lcov --remap-path-prefix --output-path coverage-ubuntu.lcov \
            --ignore-filename-regex '(/target/|/bindings\.rs$)'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: rust/coverage-ubuntu.lcov

  test-macos:
    runs-on: macos-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          cd rust
          cargo llvm-cov --lib --lcov --remap-path-prefix --output-path coverage-macos.lcov \
            --ignore-filename-regex '(/target/|/bindings\.rs$)'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos
          path: rust/coverage-macos.lcov

  coverage-report:
    runs-on: ubuntu-latest
    needs: [test-ubuntu, test-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Install coverage tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage

      - name: Combine coverage reports
        shell: bash
        run: |
          lcov -a coverage/coverage-ubuntu/coverage-ubuntu.lcov \
               -a coverage/coverage-macos/coverage-macos.lcov \
               -o combined.lcov
          # Remove generated build output; source under rust/target is not retained by this job.
          lcov --ignore-errors unused --remove combined.lcov '*/target/*' 'target/*' -o combined.lcov

      - name: Generate HTML report
        run: |
          cd rust
          genhtml ../combined.lcov --output-directory ../coverage-html --ignore-errors source

      - name: Enforce coverage threshold
        shell: bash
        run: |
          coverage=$(lcov --summary combined.lcov | awk '/lines\./ {gsub("%","",$2); print $2}')
          echo "Total line coverage: ${coverage}%"
          awk -v cov="$coverage" 'BEGIN { if (cov < 60) { exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
