[package]
name = "uqm-xtask"
version.workspace = true
edition = "2021"
publish = false
license.workspace = true
default-run = "uqm-xtask"

[lints]
workspace = true

[features]
default = ["native"]
native = ["dep:uqm-rust", "dep:uqm-engine", "dep:uqm-modes"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
toml_edit = "0.25"
uqm-rust = { optional = true, package = "uqm", path = "..", default-features = false, features = ["audio_heart", "debug-process"] }
uqm-engine = { optional = true, path = "../crates/engine", version = "=0.9.0", default-features = false }
uqm-modes = { optional = true, path = "../crates/modes", version = "=0.9.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }
